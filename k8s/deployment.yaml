apiVersion: apps/v1
kind: Deployment
metadata:
  name: split-telegram-bot
  namespace: split
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: split-telegram-bot
  template:
    metadata:
      labels:
        app: split-telegram-bot
    spec:
      containers:
        - name: split-telegram-bot
          image: rg.fr-par.scw.cloud/split/split-telegram-bot:latest
          env:
            - name: SPLIT_DB_PATH
              value: /data/split.db
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: split-telegram
                  key: TELEGRAM_BOT_TOKEN
          volumeMounts:
            - name: db
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: split-db
